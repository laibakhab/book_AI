[project]
name = "rag-agent-backend"
version = "0.1.0"
description = "Backend service for the RAG (Retrieval-Augmented Generation) agent that answers queries using book content"
readme = "README.md"
authors = [
    { name = "AI Developer", email = "ai-dev@example.com" }
]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.104.0",
    "openai>=1.3.5",
    "qdrant-client>=1.8.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "uvicorn>=0.24.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "numpy>=1.21.0",
    "cohere>=5.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "python-dotenv>=1.0.0"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["rag_agent*"]

[project.scripts]
rag-agent = "rag_agent.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_classes = ["Test*", "test_*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests"
]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
